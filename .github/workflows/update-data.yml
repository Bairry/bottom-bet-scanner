name: Actualiser les matchs

on:
  schedule:
    - cron: "17 5,11,17,22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bottom-bet-data
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Collecter les données publiques
        run: npm run scrape
        env:
          TZ: Europe/Paris
      - name: Enregistrer uniquement une actualisation valide
        run: |
          if git diff --quiet -- dist/data/matches.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/data/matches.json
          git commit -m "data: actualisation automatique"
          git push
